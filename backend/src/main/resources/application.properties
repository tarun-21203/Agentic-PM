server.port=80
spring.main.web-application-type=servlet

# Keep error responses JSON (fallback handler in controllers).
server.error.include-message=always

# Logging (so you can see AI failure reasons in CloudWatch/console)
logging.level.root=INFO
logging.level.com.agentic.pm=DEBUG

# Cognito JWT validation (Spring Resource Server)
# Set by ECS task definition:
#   COGNITO_ISSUER_URI=https://cognito-idp.${AWS_REGION}.amazonaws.com/<poolId>
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

