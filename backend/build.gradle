plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.agentic.pm'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
    // AWS SDK v2 — single BOM version so all modules match (avoids IncompatibleClassChangeError)
    implementation platform('software.amazon.awssdk:bom:2.31.2')
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:apache-client'
    // Converse API; default model (Gemma) via BEDROCK_MODEL_ID (see BedrockConverseClient)
    implementation 'software.amazon.awssdk:bedrockruntime'
    implementation 'software.amazon.awssdk:secretsmanager'

    // Apache POI for DOCX, PDF box for PDF (text extraction)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    // Spring API (ECS)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
}

test {
    useJUnitPlatform()
}

bootJar {
    archiveBaseName.set('agentic-pm-api')
    archiveVersion.set('')
}
